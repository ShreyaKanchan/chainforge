<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chainforge — consensus experiments</title><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{margin:0;background:#0b1020;color:#eef2ff;font:16px system-ui}main{max-width:1080px;margin:auto;padding:34px 24px}nav{display:flex;justify-content:space-between;border-bottom:1px solid #29314e;padding:12px 0}h1{font-size:clamp(3rem,8vw,6.5rem);line-height:.95;margin:70px 0 20px;color:#fbbf24}h2{font-size:2rem}p{color:#b6c0d8;line-height:1.7;max-width:700px}.hero{min-height:65vh}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{padding:22px;background:#171d35;border:1px solid #2a3457;border-radius:18px}.tag{color:#fbbf24}button{padding:12px 18px;border:0;border-radius:10px;background:#fbbf24;font-weight:700;cursor:pointer}a{color:#fbbf24}footer{margin-top:70px;padding:25px 0;border-top:1px solid #29314e}@media(max-width:700px){h1{margin-top:42px}}</style></head><body><div id="root"></div><script type="text/babel">function App(){const[open,setOpen]=React.useState(false);return <main><nav><b>CHAINFORGE</b><span><a href="#problem">Problem</a>　<a href="#how">How it works</a>　<a href="https://github.com/ShreyaKanchan/chainforge">GitHub ↗</a></span></nav><section className="hero"><p className="tag">CHAINFORGE / CONSENSUS EXPERIMENTS</p><h1>Chainforge: Educational proof-of-work blockchain exploring blocks, hashing, transactions,…</h1><p>Educational proof-of-work blockchain exploring blocks, hashing, transactions, mining, and validation. Chainforge is a focused prototype for protocol learners who need a clearer path from blockchain primitives to a useful product.</p><button onClick={()=>setOpen(true)}>Explore the demo</button>　<a href="#problem">Why this exists ↓</a></section><section id="problem"><p className="tag">THE PROBLEM</p><h2>Blockchain concepts are powerful, but hard to inspect.</h2><p>Real systems hide important behavior behind infrastructure, transactions, and jargon. This project makes one narrow workflow visible, testable, and easier to reason about. It is designed as a learning-friendly foundation—not a promise of production security.</p></section><section id="how"><p className="tag">THE WORKFLOW</p><div className="grid"><article className="card"><b>01 / Model</b><p>Represent the core entities and state transitions in small, readable modules.</p></article><article className="card"><b>02 / Validate</b><p>Use tests and explicit rules to show what should happen when inputs are valid—or not.</p></article><article className="card"><b>03 / Extend</b><p>Start with the prototype, then connect it to a real network, UI, or data source.</p></article></div></section><section><p className="tag">WHAT YOU CAN EXPLORE</p><div className="grid"><article className="card"><h3>consensus experiments</h3><p>See the user-facing outcome this portfolio is trying to make understandable.</p></article><article className="card"><h3>Transparent primitives</h3><p>Follow the relevant hashes, proofs, balances, messages, or permissions in the source.</p></article><article className="card"><h3>Learning surface</h3><p>Read the README, architecture notes, and tests before changing the implementation.</p></article></div></section><section><p className="tag">FAQ</p><h2>Is this production-ready?</h2><p>No. It is an educational and portfolio prototype. The value is in making the design trade-offs and failure modes clear so a production implementation can be built responsibly.</p><h2>Where is the actual code?</h2><p>The source, tests, and project notes are available in the linked GitHub repository.</p></section>{open&&<div className="card"><h2>Try the Chainforge demo</h2><input placeholder="Email"/><input placeholder="Password" type="password"/> <button onClick={()=>setOpen(false)}>Continue with mock account</button><p>This is a frontend-only demo. No credentials are collected.</p></div>}<footer><b>Build thoughtfully.</b><p>Chainforge is part of Shreya Kanchan’s blockchain portfolio.</p></footer></main>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
