<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chainforge React Studio</title><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{margin:0;background:#0b1020;color:#eef2ff;font:16px system-ui}main{max-width:960px;margin:auto;padding:52px 24px}h1{font-size:clamp(3rem,9vw,7rem);margin:25px 0;color:#fbbf24}button{padding:12px 18px;border:0;border-radius:10px;background:#fbbf24;font-weight:700;cursor:pointer}article{display:inline-block;vertical-align:top;width:26%;margin:1%;padding:18px;background:#171d35;border-radius:16px}a{color:#fbbf24}@media(max-width:700px){article{width:auto;display:block}}</style></head><body><div id="root"></div><script type="text/babel">function App(){const[open,setOpen]=React.useState(false);return <main><small>CHAINFORGE / INTERACTIVE PORTFOLIO</small><h1>Chainforge: Educational proof-of-work blockchain exploring blocks,…</h1><p>Educational proof-of-work blockchain exploring blocks, hashing, transactions, mining, and validation. This interactive landing page is wired to the project’s source and includes a safe mock account flow.</p><button onClick={()=>setOpen(!open)}>{open?'Close demo':'Try the demo'}</button> <a href="https://github.com/ShreyaKanchan/chainforge">view actual code ↗</a><section><article><b>Explore</b><p>Browse the project model and its core concepts.</p></article><article><b>Build</b><p>Use the prototype as a focused starting point.</p></article><article><b>Learn</b><p>Read the architecture and tests in GitHub.</p></article></section>{open&&<div><h2>Mock Chainforge account</h2><input placeholder="Email"/><input placeholder="Password" type="password"/> <button onClick={()=>setOpen(false)}>Sign up / log in</button><p>No credentials are stored; this is a frontend-only demo.</p></div>}</main>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
